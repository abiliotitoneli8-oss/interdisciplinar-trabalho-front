<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="color-scheme" content="light dark">
  <title>Sacola • Israelli</title>
  <script>
    // Aplica o tema antes de desenhar a página (evita piscar claro→escuro).
    try {
      var t = localStorage.getItem('israelli:tema');
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="pages.css">
</head>

      <img src="assets/gift.svg" width="15" height="15" alt="">
      <p>Sua primeira dose de felicidade tem R$ 5 OFF. Use OISRAELLI em pedidos a partir de R$ 30.</p>
    </div>
    <header class="nav" data-header></header>
    <section class="interna">
      <p class="migalha"><a href="index.html">Início</a> / Sacola</p>
      <div class="interna__cab">
        <div>
          <p class="categoria">QUASE LÁ</p>

        </div>

  <script src="app.js"></script>

</html>
